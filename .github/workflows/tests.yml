name: Tests

on:
  push:
    paths: ["odysseus/**", "evals/**", "tests/**", "requirements*.txt", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          grep -v playwright requirements-dev.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Run the tests (no keys, no network to any service)
        run: python -W ignore -m pytest -q
