# Odysseus on Fly.io: one small machine that is always on, with one disk.
#
# The bot fetches its messages from Telegram by long polling, so Telegram
# needs no open port. One port is opened all the same, by the section at the
# end of this file, for two things:
#
#   /callback   where a person's browser lands after approving a sign-in to
#               Attio or another service, so that nobody has to copy an
#               address into the chat. It needs ODYSSEUS_PUBLIC_URL below.
#   /whatsapp   Meta's deliveries, if you switch WhatsApp on. The address to
#               register with Meta is https://<your-app>.fly.dev/whatsapp
#
# Every other path answers "not found". To open no port at all, delete the
# [http_service] section and the ODYSSEUS_PUBLIC_URL line; sign-ins then come
# back through the chat.
#
app = "odysseus-611755"
primary_region = "sin"
# On a deploy or a stop the program is given this long to close its agents and finish writing its files.
kill_timeout = 30
# Measured on this machine: the program holds about 390 MB and each connected agent about 130 MB. The host alone
# (three agents) leaves under 100 MB of 1 GB free, and another person's first message would run it out. Swap on the
# machine's own disk costs nothing and turns running out into running slowly; more memory is the real answer (below).
swap_size_mb = 1024

[env]
  ODYSSEUS_DATA_DIR = "/data"
  # The server's own clock is UTC. Reminders, routines and message stamps must
  # use the owner's local time.
  ODYSSEUS_TZ = "Asia/Kolkata"
  # This app's own address. Change it with the app's name.
  ODYSSEUS_PUBLIC_URL = "https://odysseus-611755.fly.dev"

[mounts]
  source = "odysseus_data"
  destination = "/data"
  # The host photographs the disk once a day. Kept for two weeks here; the default is five days.
  snapshot_retention = 14

# Memory, measured on this machine: about 770 MB with the host's agents
# connected and nobody else talking, and about 130 MB more for each agent of
# another person while they talk (nothing fifteen minutes after they stop).
# 1 GB holds the host alone and only with the swap above; use 2gb as soon as
# a second person is invited.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[restart]]
  policy = "always"

# For sign-ins coming back, and for WhatsApp. See the note at the top of this file.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  # The host asks the program's own door whether it is alive, and shows the answer in `fly status` and `fly checks list`.
  # A start takes about half a minute, so the first minute is not counted (the longest the host allows).
  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
